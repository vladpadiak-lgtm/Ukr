name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official data
        run: |
          if ! node scripts/sync-wanted-data.mjs; then
            echo "The government portal is unavailable; using the verified public snapshot."
            mkdir -p public/data
            for file in meta.json index.json 2022.json 2023.json 2024.json 2025.json 2026.json; do
              curl --fail --location --retry 5 \
                "https://reiestr-rozshuku-ua.vladpadiak.chatgpt.site/data/${file}" \
                --output "public/data/${file}"
            done
          fi

      - name: Build static site
        run: node scripts/build-github-pages.mjs

      - name: Use GitHub Actions as the Pages source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --location --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --data '{"build_type":"workflow"}'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
