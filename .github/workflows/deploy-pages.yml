name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
      - app.js
      - styles.css
      - "data/**"
      - .nojekyll
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download official data
        run: |
          if ! node scripts/sync-wanted-data.mjs; then
            echo "The government portal is unavailable; using the verified public snapshot."
            mkdir -p public/data
            for file in meta.json index.json 2022.json 2023.json 2024.json 2025.json 2026.json; do
              curl --fail --location --retry 5 \
                "https://reiestr-rozshuku-ua.vladpadiak.chatgpt.site/data/${file}" \
                --output "public/data/${file}"
            done
          fi

      - name: Build static site
        run: node scripts/build-github-pages.mjs

      - name: Publish generated site into the repository
        run: |
          cp _site/index.html index.html
          cp _site/app.js app.js
          cp _site/styles.css styles.css
          cp _site/.nojekyll .nojekyll
          rm -rf data
          cp -R _site/data data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css .nojekyll data
          if git diff --cached --quiet; then
            echo "Published site is already up to date."
            exit 0
          fi
          git commit -m "Publish complete GitHub Pages site"
          git push
